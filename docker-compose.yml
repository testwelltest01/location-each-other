# [공부 포인트 1] Docker Compose 가이드
# 이 파일은 여러 개의 컨테이너(여기서는 DB와 API 서버)를 한 번에 관리하기 위한 설정 파일입니다.

services:
  # 1. 데이터베이스(PostgreSQL) 서비스 설정
  db:
    image: postgres:16  # 공식 PostgreSQL 16 버전 이미지를 사용합니다.
    container_name: pickup-db
    restart: unless-stopped  # 에러로 꺼졌을 때 다시 실행해주지만, 수동으로 껐을 때는 재시작하지 않습니다.
    environment:
      # [공부 포인트 2] 환경 변수
      # 컨테이너 안에서 사용할 초기 DB 설정값들입니다.
      POSTGRES_DB: pickup_mvp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 호스트의 5432 포트와 컨테이너 내부의 5432 포트를 연결합니다.
      - "5432:5432"
    volumes:
      # [공부 포인트 3] 데이터 볼륨
      # 컨티이너가 삭제되어도 데이터가 사라지지 않도록 DB 데이터를 호스트에 저장합니다.
      - pickup_db_data:/var/lib/postgresql/data

  # 2. API 서버(FastAPI) 서비스 설정
  api:
    image: python:3.12-slim # 경량화된 파이썬 3.12 이미지를 사용합니다.
    container_name: pickup-api
    working_dir: /app  # 컨테이너 안의 기본 작업 경로입니다.
    volumes:
      # [공부 포인트 4] 바인드 마운트
      # 현재 내 폴더(.)를 컨테이너 안의 /app 폴더와 실시간으로 동기화합니다.
      # 덕분에 내 컴퓨터에서 코드를 수정하면 컨테이너 안에도 바로 반영됩니다!
      - .:/app
    depends_on:
      # [공부 포인트 5] 의존성 설정
      # db 서비스(컨테이너)가 먼저 시작된 후에 api 서비스가 시작되도록 보장합니다.
      - db
    environment:
      # 앱에서 사용할 DB 접속 주소입니다.
      # [공부 포인트 6] 네트워크 별칭
      # docker-compose 안에서는 IP 대신 서비스 이름인 'db'를 호스트명으로 쓸 수 있습니다.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pickup_mvp
    command: >
      # [공부 포인트 7] 컨테이너 실행 명령어
      # 1) 필요한 패키지를 설치하고, 2) 서버를 실행합니다.
      # --reload 옵션으로 코드 수정 시 서버가 자동으로 재시작됩니다.
      sh -c "pip install --no-cache-dir -r requirements.txt
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      # 브라우저에서 'localhost:8000'으로 접속할 수 있게 연결합니다.
      - "8000:8000"

# 위에서 정의한 볼륨을 실제로 생성합니다.
volumes:
  pickup_db_data: